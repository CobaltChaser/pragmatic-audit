<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">pragmatic-audit — code quality audits for AI-generated code</title>
  <desc id="desc">A zero-dependency CLI and agent skill that checks code against The Pragmatic Programmer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D18"/>
      <stop offset="0.55" stop-color="#0C1424"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="panel" x1="756" y1="104" x2="1180" y2="536" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152139"/>
      <stop offset="1" stop-color="#0C1527"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#94A3B8" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1190" cy="46" r="170" fill="#F2B84B" fill-opacity="0.07" filter="url(#glow)"/>
  <circle cx="70" cy="610" r="150" fill="#5EEAD4" fill-opacity="0.05" filter="url(#glow)"/>
  <rect x="0" y="0" width="8" height="640" fill="#F2B84B"/>

  <text x="72" y="104" fill="#7DD3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4.2">A PRAGMATIC PROGRAMMER TOOL</text>

  <text x="68" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="700" letter-spacing="-3.4">
    <tspan fill="#F8FAFC">pragmatic</tspan><tspan fill="#F2B84B">-audit</tspan>
  </text>

  <text x="72" y="272" fill="#D7E0EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="600">Code quality audits for AI-generated code.</text>
  <text x="72" y="310" fill="#93A3BD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Find DRY violations, weak contracts, missing tests, and other</text>
  <text x="72" y="338" fill="#93A3BD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">changeability risks before they compound.</text>

  <rect x="72" y="386" width="168" height="38" rx="19" fill="#17233C" stroke="#2B3A55"/>
  <text x="156" y="410" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ZERO DEPENDENCIES</text>
  <rect x="252" y="386" width="136" height="38" rx="19" fill="#17233C" stroke="#2B3A55"/>
  <text x="320" y="410" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PYTHON 3.11+</text>
  <rect x="400" y="386" width="184" height="38" rx="19" fill="#17233C" stroke="#2B3A55"/>
  <text x="492" y="410" text-anchor="middle" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">AGENT SKILLS READY</text>

  <text x="72" y="514" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$ pip install pragmatic-audit</text>
  <text x="72" y="556" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">github.com/CobaltChaser/pragmatic-audit</text>

  <rect x="724" y="86" width="484" height="468" rx="16" fill="url(#panel)" stroke="#2A3954"/>
  <rect x="724" y="86" width="484" height="50" rx="16" fill="#182640"/>
  <rect x="724" y="118" width="484" height="18" fill="#182640"/>
  <circle cx="754" cy="111" r="5" fill="#F87171"/>
  <circle cx="774" cy="111" r="5" fill="#FBBF24"/>
  <circle cx="794" cy="111" r="5" fill="#34D399"/>
  <text x="1178" y="116" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">pragmatic-audit</text>

  <text x="756" y="176" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$ <tspan fill="#E2E8F0">pragmatic-audit .</tspan></text>
  <text x="756" y="216" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">Signal 84/100  <tspan fill="#64748B" font-weight="400">heuristic</tspan></text>
  <text x="756" y="244" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">high 0</text>
  <text x="824" y="244" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">medium 2</text>
  <text x="924" y="244" fill="#7DD3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">low 3</text>

  <line x1="756" y1="272" x2="1176" y2="272" stroke="#2A3954"/>
  <text x="756" y="306" fill="#7DD3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">PP-DRY</text>
  <text x="832" y="306" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">src/orders.py:41</text>
  <text x="756" y="336" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Duplicated 6-line block</text>
  <text x="756" y="362" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Fix: extract the shared knowledge</text>

  <text x="756" y="414" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">PP-CONTRACTS</text>
  <text x="900" y="414" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">src/client.py:18</text>
  <text x="756" y="444" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">except Exception swallows the error</text>
  <text x="756" y="470" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Fix: handle it, add context, or fail fast</text>

  <line x1="756" y1="496" x2="1176" y2="496" stroke="#2A3954"/>
  <text x="756" y="526" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">MANUAL REVIEW</text>
  <text x="886" y="526" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">tracer bullets, contracts, orthogonality</text>
</svg>
