<line x1="156" y1="330" x2="1044" y2="330" stroke="#E2DCCF"/>
<text x="156" y="366" fill="#152033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Top fixes</text>
<text x="156" y="398" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">1.</text>
<text x="184" y="398" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">HIGH</text>
<text x="252" y="398" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PP-CONTRACTS</text>
<text x="344" y="398" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">src/orders.py:18</text>
<text x="156" y="418" fill="#152033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">`except Exception` swallows the error.</text>
<text x="156" y="436" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Fix: Handle the error, add context and re-raise, or fail fast.</text>
<text x="156" y="460" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">2.</text>
<text x="184" y="460" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">HIGH</text>
<text x="252" y="460" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PP-CONFIG</text>
<text x="344" y="460" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">src/orders.py:27</text>
<text x="156" y="480" fill="#152033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Environment-specific URL is hardcoded.</text>
<text x="156" y="498" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Fix: Move environment-specific values into configuration or a secret store.</text>
<text x="156" y="522" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">3.</text>
<text x="184" y="522" fill="#C98A16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">MEDIUM</text>
<text x="252" y="522" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PP-TESTS</text>
<text x="344" y="522" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tests/test_orders.py:14</text>
<text x="156" y="542" fill="#152033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Test `test_total_runs` has no assertion.</text>
<text x="156" y="560" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Fix: Test the behavior you expect to keep; add a failing test before a fix.</text>
<text x="156" y="584" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">4.</text>
<text x="184" y="584" fill="#C98A16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">MEDIUM</text>
<text x="252" y="584" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PP-BROKEN-WINDOWS</text>
<text x="344" y="584" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">tests/test_orders.py:8</text>
<text x="156" y="604" fill="#152033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Test is skipped or ignored.</text>
<text x="156" y="622" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Fix: Fix it now, or record a bounded, visible plan to fix it.</text>
<text x="156" y="646" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">5.</text>
<text x="184" y="646" fill="#C98A16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">MEDIUM</text>
<text x="252" y="646" fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PP-COINCIDENCE</text>
<text x="344" y="646" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">src/orders.py:13</text>
<text x="156" y="666" fill="#152033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Mutable default argument in `total`.</text>
<text x="156" y="684" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Fix: Make the behavior explicit and rely on documented semantics.</text>
<text x="156" y="668" fill="#6B7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Findings are hypotheses. Read the code before changing it.</text>
