<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">pragmatic-audit</title>
  <desc id="desc">Ship code that is easy to change, even when an agent wrote it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090E1A"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="panel" x1="720" y1="66" x2="1140" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141F37"/>
      <stop offset="1" stop-color="#0D1527"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <circle cx="1110" cy="34" r="120" fill="#F2B84B" fill-opacity="0.05" filter="url(#glow)"/>
  <circle cx="84" cy="390" r="100" fill="#5EEAD4" fill-opacity="0.04" filter="url(#glow)"/>

  <text x="64" y="112" fill="#7DD3C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.6">A PRAGMATIC PROGRAMMER TOOL</text>

  <text x="62" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="700" letter-spacing="-2.5">
    <tspan fill="#F8FAFC">pragmatic</tspan><tspan fill="#F2B84B">-audit</tspan>
  </text>

  <text x="66" y="262" fill="#B6C2D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Ship code that is easy to change — even when an agent wrote it.</text>

  <text x="66" y="318" fill="#7C8AA5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ZERO DEPENDENCIES</text>
