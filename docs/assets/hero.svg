  <text x="246" y="318" fill="#7C8AA5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">PYTHON 3.11+</text>
  <circle cx="382" cy="314" r="2.5" fill="#3D4B63"/>
  <text x="399" y="318" fill="#7C8AA5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">AGENT SKILLS READY</text>

  <rect x="700" y="70" width="440" height="280" rx="14" fill="url(#panel)" stroke="#26334D"/>
  <rect x="700" y="70" width="440" height="40" rx="14" fill="#17233C"/>
  <rect x="700" y="96" width="440" height="14" fill="#17233C"/>
  <circle cx="726" cy="90" r="4.5" fill="#F87171"/>
  <circle cx="744" cy="90" r="4.5" fill="#FBBF24"/>
  <circle cx="762" cy="90" r="4.5" fill="#34D399"/>
  <text x="1120" y="94" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">pragmatic-audit</text>

  <text x="728" y="142" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">$ <tspan fill="#E2E8F0">pragmatic-audit .</tspan></text>
  <text x="728" y="174" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">Signal 84/100  <tspan fill="#64748B" font-weight="400">heuristic</tspan></text>
  <text x="728" y="196" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">high 0</text>
  <text x="790" y="196" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">medium 2</text>
